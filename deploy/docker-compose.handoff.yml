services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: motefaker
      POSTGRES_USER: motefaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motefaker -d motefaker"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://motefaker:${POSTGRES_PASSWORD}@postgres:5432/motefaker
      ADMIN_PASSWORD_SHA256: ${ADMIN_PASSWORD_SHA256:?set ADMIN_PASSWORD_SHA256}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8397}:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
volumes:
  pgdata:
